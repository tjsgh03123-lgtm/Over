name: Build AAB (Play 업로드용)
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: 서명 키 확인
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::저장소 Secrets에 ANDROID_KEYSTORE_BASE64 가 없습니다. store/README.md 의 3번을 먼저 하세요."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - run: npm test
      - name: 포즈 모델 내려받기 (실시간 횟수 세기용, 앱에 포함됨)
        run: |
          mkdir -p modules/pose-camera/android/src/main/assets
          for m in lite full; do
            curl --fail -L --retry 4 --retry-delay 3 -o "modules/pose-camera/android/src/main/assets/pose_landmarker_${m}.task" \
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${m}/float16/latest/pose_landmarker_${m}.task"
          done
      - name: 업로드 키 풀기
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 서명·버전 설정이 들어갔는지 확인
        run: |
          grep -n "overdriveRelease\|versionCode" android/app/build.gradle
          grep -n "targetSdk\|compileSdk\|minSdk" android/build.gradle android/gradle.properties 2>/dev/null || true
      - run: ./gradlew bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 앱이 요청하는 권한 목록 (Play 데이터 보안 답안과 맞는지 확인용)
        continue-on-error: true
        run: |
          f=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*release*" | head -1)
          echo "$f"; grep -o 'uses-permission[^/]*' "$f" | sort -u
      - name: 16KB 메모리 페이지 정렬 확인
        run: python3 .github/scripts/check16k.py android/app/build/outputs/bundle/release/app-release.aab
        continue-on-error: true
      - name: 서명 확인
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: overdrive-aab
          path: android/app/build/outputs/bundle/release/*.aab
