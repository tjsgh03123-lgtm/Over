name: Build APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - run: npm test
      - name: 포즈 모델 내려받기 (영상 분석용, 앱에 포함됨)
        run: |
          mkdir -p modules/pose-analyzer/android/src/main/assets
          for m in lite full heavy; do
            curl --fail -L --retry 4 --retry-delay 3 -o "modules/pose-analyzer/android/src/main/assets/pose_landmarker_${m}.task" \
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${m}/float16/latest/pose_landmarker_${m}.task"
          done
          ls -l modules/pose-analyzer/android/src/main/assets
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: overdrive-apk
          path: android/app/build/outputs/apk/release/*.apk
