name: Web preview
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo install react-dom react-native-web @expo/metro-runtime
      - run: npm install --no-save sql.js@1.10.3
      - run: npm test
      - run: npx expo export --platform web
      - name: sql.js 파일 복사 (웹 미리보기 저장소용)
        run: |
          cp node_modules/sql.js/dist/sql-wasm.js dist/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm dist/sql-wasm.wasm
          find dist -type f | head -50
          du -sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist
      - name: 결과를 preview-dist 브랜치에 올림 (내려받기 편하게)
        run: |
          cd dist
          git init -q -b preview-dist
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "web preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview-dist
